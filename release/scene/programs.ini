# Shelf text and art id of every program the demo disc carries, for scene-disc editions
# (mkdisc --programs, read with --edition). The text is the owner's; edit it here only.
# A program's cover is compiled into the launcher (launcher/src/cover.rs) from its own repository's
# launcher-art; `art` names the shelf screenshots menu-art ext cooked from the same directory.

[HALF-LIFE]
describe = A from-scratch PlayStation port of Half-Life. The full campaign has been converted and much of the game works, but it is not yet playable from start to finish.|Half-Life portato su PlayStation da zero. L'intera campagna e stata convertita e gran parte del gioco funziona, ma non e ancora giocabile dall'inizio alla fine.
art = halflife

[COUNTER-STRIKE]
describe = A from-scratch PlayStation port of Counter-Strike 1.6, cooked from your own copy. Bots, the buy menu, bomb and hostage rounds, and two-player split screen. Still in development.|Counter-Strike 1.6 portato su PlayStation da zero, partendo dalla propria copia del gioco. Bot, menu acquisti, bomba, ostaggi e schermo diviso per due giocatori. In sviluppo.
art = cstrike

[HARDWARE TESTS]
describe = A hardware test suite, not a game. The current suite is working and ready to use, displaying real PlayStation measurements as photo-ready codes for checking emulator accuracy.|Una suite di test hardware, non un gioco. E funzionante e pronta all'uso: mostra le misure della vera PlayStation come codici da fotografare per verificare la precisione degli emulatori.

[WIPEOUT PSOXIDE]
describe = WipEout (1995) rewritten in Rust for the original PlayStation, cooked from your own copy of the game. Tracks, ships, weapons and two-player split screen.|WipEout (1995) riscritto in Rust per la prima PlayStation, partendo dalla propria copia del gioco. Piste, navi, armi e schermo diviso per due.
art = wipeout

[OCARINA OF TIME]
describe = An early from-scratch PlayStation port of Ocarina of Time, cooked from your own ROM. The opening and Kokiri Forest can be explored. Still in development and slow.|Un primo port di Ocarina of Time per PlayStation, fatto da zero partendo dalla propria ROM. Si esplorano l'inizio e la Foresta Kokiri. In sviluppo e lento.
art = oot

[HOLLOW KNIGHT]
describe = An early from-scratch PlayStation port of Hollow Knight, cooked from your own copy. King's Pass, Dirtmouth and the Forgotten Crossroads can be explored, with enemies, benches and saves.|Un primo port di Hollow Knight per PlayStation, fatto da zero partendo dalla propria copia. Si esplorano King's Pass, Dirtmouth e il Crocevia Dimenticato, con nemici, panchine e salvataggi.
art = hollow

[CORTEX CITADEL]
describe = The new Cortex engine, tested on a small Citadel level. This is an engine test, not a game demo; Cortex Ignition is the old-engine demo.|Il nuovo motore di Cortex, provato su un piccolo livello della Cittadella. E un test del motore, non una demo; Cortex Ignition e la demo del vecchio motore.
art = citadel

[SPLAT DEMO]
describe = Five animated scenes built only from splats: thousands of small soft discs. Trade detail for frame rate and move the camera yourself.|Cinque scene animate fatte solo di splat: migliaia di piccoli dischi sfumati. Scambia dettaglio e fluidita e muovi tu la camera.
art = splat

[QUAKE SHAREWARE]
describe = Quake 1.06 shareware for PS1, built on PSoXide with id's GPL source and the QuakePSX C port as references. All nine maps, the full arsenal and Chthon. Still in development.|Quake 1.06 shareware per PS1, costruito su PSoXide usando il sorgente GPL di id e il port C QuakePSX come riferimenti. Nove mappe, arsenale completo e Chthon. In sviluppo.
art = quake

[360X]
describe = Turn, thrust, fire and grab pods across alien planets. Restored from its original source.|Ruota, spingi, spara e raccogli le capsule su pianeti alieni. Restaurato dai sorgenti originali.

[QD UP]
describe = A pool game restored from its original source, on a 3D table or a flat 2D one.|Un gioco di biliardo restaurato dai sorgenti originali, su tavolo 3D o in 2D.

[PSOXIDE ARCADE]
describe = Three complete native PlayStation arcade games in one collection: Breakout, Space Invaders and Magikarp Pong, with its own live CD-audio visualizer.|Tre giochi arcade completi e nativi per PlayStation in una raccolta: Breakout, Space Invaders e Magikarp Pong, con visualizzatore CD audio.
art = arcade

[PSXCEL]
describe = A working Microsoft Excel clone for the original PlayStation, controlled with a joypad. This build is fully functional, with formulas, charts, themes and memory-card saves.|Un clone funzionante di Microsoft Excel per PlayStation, controllato col joypad. Questa versione e completa e include formule, grafici, temi e salvataggi su memory card.
art = psxcel

[VOXIDE]
describe = A Minecraft clone built for the original PlayStation. This is an early playable build: world generation, mining, crafting and survival work.|Un clone di Minecraft per la prima PlayStation. Prima versione giocabile: generazione del mondo, scavo, crafting e sopravvivenza funzionano.
art = voxide

[NITROXIDE]
describe = A Rocket League clone built for the original PlayStation. Supports 2 players in split screen.|Un clone di Rocket League per la prima PlayStation. Supporta 2 giocatori a schermo diviso.
art = nitro

[CELESTE COLLECTION]
describe = Both Celeste Classic games, rebuilt from PICO-8 as native PlayStation games.|I due Celeste Classic, ricostruiti da PICO-8 come giochi nativi PlayStation.
art = celeste
