# PSoXide Demo Disc, Public edition (itch; never burned)
# Scene-core edition (make scene-disc EDITION=release/scene/public.ini), carousel order as the v0.59 lineup.
# Every input is a lane's scene disc (mkisopsx --scenes) on the disc's SDK pin, under
# ${RELEASE_INPUTS}/scene-public/: the image (or bare exe), its boot exe's link map beside it, and
# `ready`, the RAM state of its first playable screen, which the game's lane names. A section whose
# files are not there stops the press with the path; `waiting:` says who delivers it. Versions are
# the v0.59 lineup's until a lane delivers its build.

[PSOXIDE ARCADE]
# waiting: the psoxide-arcade lane's scene-core build
image = ${RELEASE_INPUTS}/scene-public/arcade/PSoXide Arcade (psoxide-arcade).cue
map = ${RELEASE_INPUTS}/scene-public/arcade/PSoXide Arcade (psoxide-arcade).map
version = 0.1.1

[CELESTE COLLECTION]
# waiting: the celeste-collection-psx lane's scene-core build
exe = ${RELEASE_INPUTS}/scene-public/celeste/celeste-collection.exe
map = ${RELEASE_INPUTS}/scene-public/celeste/celeste-collection.map
version = 0.2.8

[NITROXIDE]
# waiting: the nitroxide lane's scene-core build
image = ${RELEASE_INPUTS}/scene-public/nitroxide/NitroXide.cue
map = ${RELEASE_INPUTS}/scene-public/nitroxide/NitroXide.map
version = 0.6.0
alias = MUSIC1.XA:MUSIC1.XA
alias = MUSIC2.XA:MUSIC2.XA

[VOXIDE]
# waiting: the voxide lane's scene-core build
image = ${RELEASE_INPUTS}/scene-public/voxide/VoXide.cue
map = ${RELEASE_INPUTS}/scene-public/voxide/VoXide.map
version = 0.4.1
edge_tail = MUSIC1.XA
alias = PIANO1.XA:MUSIC1.XA

[SPLAT DEMO]
# waiting: the ps1-splat-mock lane's scene-core build
image = ${RELEASE_INPUTS}/scene-public/splat/Splat Demo.cue
map = ${RELEASE_INPUTS}/scene-public/splat/Splat Demo.map
version = 0.1

[QUAKE SHAREWARE]
# waiting: the quake-psx lane's scene-core build
image = ${RELEASE_INPUTS}/scene-public/quake/Quake (quake-psx).cue
map = ${RELEASE_INPUTS}/scene-public/quake/Quake (quake-psx).map
version = 0.1.1

[360X]
# waiting: the nms-restore (360X) lane's scene-core build
image = ${RELEASE_INPUTS}/scene-public/360x/360x.cue
map = ${RELEASE_INPUTS}/scene-public/360x/360x.map
version = 0.5
ready = gamecycle ge 100

[QD UP]
# waiting: the nms-restore (QD Up) lane's scene-core build
image = ${RELEASE_INPUTS}/scene-public/qdup/qdup.cue
map = ${RELEASE_INPUTS}/scene-public/qdup/qdup.map
version = 0.5
ready = cursor eq 4

[PSXCEL]
# waiting: the psxcel lane's scene-core build
exe = ${RELEASE_INPUTS}/scene-public/psxcel/PSXcel.exe
map = ${RELEASE_INPUTS}/scene-public/psxcel/PSXcel.map
version = 0.2.0
