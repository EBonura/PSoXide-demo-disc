# PSoXide Demo Disc, Public edition (itch; never burned)
# Scene-core edition (make scene-disc EDITION=release/scene/public.ini), carousel order as the v0.59 lineup.
# Every input is a lane's scene disc (mkisopsx --scenes) on the disc's SDK pin, under
# ${RELEASE_INPUTS}/scene-public/: the image (or bare exe), its boot exe's link map beside it, and
# `ready`, the RAM state of its first playable screen, which the game's lane names. A section whose
# files are not there stops the press with the path; `waiting:` says who delivers it. Versions are
# the v0.59 lineup's until a lane delivers its build. A delivered section names the lane's own files
# (read only) until the release inputs are copied for the candidate. A section goes into a candidate
# only from a disc its lane reports LANDED on SDK main, with `sdk =` (that SDK commit), `commit =` (the
# game's landed commit) and `provenance =` (its build record, which must name that SDK commit):
# `make scene-disc` refuses any other pin.

