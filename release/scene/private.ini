# PSoXide Demo Disc, Private edition (the disc that is burned; never published)
# Scene-core edition (make scene-disc EDITION=release/scene/private.ini), carousel order as the v0.59 lineup.
# Every input is a lane's scene disc (mkisopsx --scenes) on the disc's SDK pin, under
# ${RELEASE_INPUTS}/scene-private/: the image (or bare exe), its boot exe's link map beside it, and
# `ready`, the RAM state of its first playable screen, which the game's lane names. A section whose
# files are not there stops the press with the path; `waiting:` says who delivers it. Versions are
# the v0.59 lineup's until a lane delivers its build.

[CELESTE COLLECTION]
# waiting: the celeste-collection-psx lane's scene-core build
exe = ${RELEASE_INPUTS}/scene-private/celeste/celeste-collection.exe
map = ${RELEASE_INPUTS}/scene-private/celeste/celeste-collection.map
version = 0.2.8

[NITROXIDE]
# waiting: the nitroxide lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/nitroxide/NitroXide.cue
map = ${RELEASE_INPUTS}/scene-private/nitroxide/NitroXide.map
version = 0.6.0
alias = MUSIC1.XA:MUSIC1.XA
alias = MUSIC2.XA:MUSIC2.XA

[VOXIDE]
# waiting: the voxide lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/voxide/VoXide.cue
map = ${RELEASE_INPUTS}/scene-private/voxide/VoXide.map
version = 0.4.1
edge_tail = MUSIC1.XA
alias = PIANO1.XA:MUSIC1.XA

[SPLAT DEMO]
# waiting: the ps1-splat-mock lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/splat/Splat Demo.cue
map = ${RELEASE_INPUTS}/scene-private/splat/Splat Demo.map
version = 0.1

[WIPEOUT PSOXIDE]
# waiting: the wipeout-psx lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/wipeout/WipEout PSoXide.cue
map = ${RELEASE_INPUTS}/scene-private/wipeout/WipEout PSoXide.map
version = 0.1.0

[HOLLOW KNIGHT]
# waiting: the hk-psx lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/hk/Hollow Knight (hk-psx).cue
map = ${RELEASE_INPUTS}/scene-private/hk/Hollow Knight (hk-psx).map
version = 0.1.0

[COUNTER-STRIKE]
# waiting: the cs-psx lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/cs/Counter-Strike (cs-psx).cue
map = ${RELEASE_INPUTS}/scene-private/cs/Counter-Strike (cs-psx).map
version = 0.2.0

[HALF-LIFE]
# waiting: the hl-psx (with its intro) lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/hl/Half-Life (hl-psx).cue
map = ${RELEASE_INPUTS}/scene-private/hl/Half-Life (hl-psx).map
version = 0.2.0

[OCARINA OF TIME]
# waiting: the oot-psx lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/oot/Ocarina of Time (oot-psx).cue
map = ${RELEASE_INPUTS}/scene-private/oot/Ocarina of Time (oot-psx).map
version = 0.1.0

[QUAKE SHAREWARE]
# waiting: the quake-psx lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/quake/Quake (quake-psx).cue
map = ${RELEASE_INPUTS}/scene-private/quake/Quake (quake-psx).map
version = 0.1.1

[360X]
# waiting: the nms-restore (360X) lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/360x/360x.cue
map = ${RELEASE_INPUTS}/scene-private/360x/360x.map
version = 0.5
ready = gamecycle ge 100

[QD UP]
# waiting: the nms-restore (QD Up) lane's scene-core build
image = ${RELEASE_INPUTS}/scene-private/qdup/qdup.cue
map = ${RELEASE_INPUTS}/scene-private/qdup/qdup.map
version = 0.5
ready = cursor eq 4
