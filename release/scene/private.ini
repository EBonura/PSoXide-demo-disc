# PSoXide Demo Disc, Private edition (the disc that is burned; never published)
# Scene-core edition (make scene-disc EDITION=release/scene/private.ini), carousel order as the v0.59 lineup.
# Every input is a lane's scene disc (mkisopsx --scenes) on the disc's SDK pin, under
# ${RELEASE_INPUTS}/scene-private/: the image (or bare exe), its boot exe's link map beside it, and
# `ready`, the RAM state of its first playable screen, which the game's lane names. A section whose
# files are not there stops the press with the path; `waiting:` says who delivers it. Versions are
# the v0.59 lineup's until a lane delivers its build. A delivered section names the lane's own files
# (read only) until the release inputs are copied for the candidate.

[CELESTE COLLECTION]
# delivered: celeste-scenes-1123 lane, on SDK main 80d432926e69 (CORE_HASH 558d3246); passed the launch gate 11-24
image = /Users/ebonura/Desktop/repos/campaign-2026-10-15/celeste-scenes-1123/handoff-disc/celeste-collection.cue
version = 0.2.8
map = /Users/ebonura/Desktop/repos/campaign-2026-10-15/celeste-scenes-1123/handoff-disc/celeste-collection.map
gate = /Users/ebonura/Desktop/repos/campaign-2026-10-15/celeste-scenes-1123/handoff-disc/psx-gate.toml
ready = SCENE_CURRENT eq 1 u16
press = 40:circle

