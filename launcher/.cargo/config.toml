# The architecture gate (sdk/docs/GATE.md) reads this program's exceptions from here.
#
# No rustflags here: the Makefile hands the SDK's build policy to `psoxide-pgo apply` (every delay-slot
# filler search on, the shared panic policy), and the driver refuses a RUSTFLAGS environment.
[env]
PSX_GATE_FILE = { value = "../psx-gate.toml", relative = true }
