# `trim-paths` is a nightly cargo feature; these crates are nightly-pinned
# anyway (bare-metal MIPS needs build-std), so the gate costs nothing.
cargo-features = ["trim-paths"]

[package]
name    = "launcher"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

# Outside any workspace: this links for the PS1 with psoxide.ld.
[workspace]

[[bin]]
name = "launcher"
path = "src/main.rs"

[profile.release]
# Keep absolute host paths out of the shipped binary. rustc records the
# source path of every panic/assert site (core::panic::Location) as a
# string in .rodata, which on the PS1 means the developer's home directory
# occupies console RAM and ships on the public disc image.
trim-paths    = "all"
panic         = "abort"
codegen-units = 1
lto           = true

[features]
# The Private edition: the programs that are bring-your-own-assets (WipEout,
# Hollow Knight, Counter-Strike, Half-Life, Ocarina of Time) have covers in
# the menu. Off, the binary holds neither their art nor their names, which a
# Public disc must not carry anywhere (`disc-tools public-only` scans for them).
# The Makefile turns it on whenever a pressing includes one of them.
private = []

[dependencies]
chainload-layout = { path = "../chainload-layout" }
psx-gpu  = { path = "../games/PSoXide-editor/sdk/crates/psx-gpu" }
psx-pack = { path = "../games/PSoXide-editor/sdk/crates/psx-pack" }
psx-pad  = { path = "../games/PSoXide-editor/sdk/crates/psx-pad" }
psx-rt   = { path = "../games/PSoXide-editor/sdk/crates/psx-rt" }
psx-vram = { path = "../games/PSoXide-editor/sdk/crates/psx-vram" }
psx-math = { path = "../games/PSoXide-editor/sdk/crates/psx-math" }
psx-io   = { path = "../games/PSoXide-editor/sdk/crates/psx-io" }
psx-spu  = { path = "../games/PSoXide-editor/sdk/crates/psx-spu" }
stick-nav = { path = "stick-nav" }
psx-sfx  = { path = "../games/PSoXide-editor/sdk/crates/psx-sfx" }
disc-toc = { package = "psx-disc-toc", path = "../games/PSoXide-editor/engine/crates/psx-disc-toc" }
playlist = { path = "playlist" }
psx-fmv  = { path = "../games/PSoXide-editor/sdk/crates/psx-fmv" }
psx-hw   = { path = "../games/PSoXide-editor/crates/psx-hw" }
psx-gte  = { path = "../games/PSoXide-editor/sdk/crates/psx-gte" }
