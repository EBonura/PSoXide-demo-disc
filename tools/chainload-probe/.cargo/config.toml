# Flags live here, not in RUSTFLAGS: the SDK's build driver (psoxide-pgo apply) refuses a RUSTFLAGS
# environment. The linker script and the output format come from build.rs.
[target.mipsel-sony-psx]
rustflags = ["-Cllvm-args=-disable-mips-df-backward-search"]

# The architecture gate (sdk/docs/GATE.md) reads this repository's exceptions from here.
[env]
PSX_GATE_FILE = { value = "../../psx-gate.toml", relative = true }
