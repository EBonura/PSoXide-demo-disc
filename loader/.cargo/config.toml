# The delay-slot flags and the panic policy are the SDK's: the Makefile passes them as
# `PSX_POLICY`, as for the launcher, and `hazard-scan --raw` proves the blob clean afterwards.
[target.mipsel-sony-psx]
rustflags = ["-Clink-arg=--oformat=binary"]

# The architecture gate (sdk/docs/GATE.md) reads this program's exceptions from here.
[env]
PSX_GATE_FILE = { value = "../psx-gate.toml", relative = true }
